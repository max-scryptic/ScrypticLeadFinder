# Runs every live collector on a schedule and stores what they find in Neon.
#
# Needs these repository secrets (Settings > Secrets and variables > Actions):
#   DATABASE_URL, COMPANIES_HOUSE_API_KEY, COMPANIES_HOUSE_STREAM_KEY,
#   BRAVE_SEARCH_API_KEY (optional: without it websites are only guessed)
#
# GitHub only runs scheduled workflows from the default branch, so this starts
# once it is merged to main. Use "Run workflow" on the Actions tab to run it by hand.
name: Collect leads

on:
  schedule:
    # Every 3 hours, at 17 past: GitHub drops scheduled runs most often at the
    # top of the hour, and starts the rest late, often by hours.
    #
    # The stream alone would be fine every 6 hours. It carries every filing
    # (6,000 to 12,000 events an hour) and keeps only a limited backlog, and
    # each run resumes where the last one stopped. A daily gap would not be
    # caught up: each run would fall further behind, and filings would be
    # lost once the saved position dropped out of the backlog.
    #
    # What sets the pace is reading SH01 documents, which gets whatever time
    # the stream and company lookups leave. A long gap spends most of a run
    # catching up the stream, and a busy day brings more SH01s than one run
    # reads, so shorter gaps keep the amounts from falling behind.
    - cron: "17 */3 * * *"
  workflow_dispatch:
    inputs:
      sources:
        description: "Source ids to run, space separated (blank for all)"
        required: false
        default: ""

# Never two runs at once: Companies House allows two stream connections per account.
concurrency:
  group: collect-leads
  cancel-in-progress: false

jobs:
  collect:
    runs-on: ubuntu-latest
    # Room for every collector and the website finder to use their whole budgets, plus install time.
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run db:migrate
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
      - name: Run collectors
        # Fifteen minutes per collector. The Companies House one splits it
        # between the stream, company lookups, filing histories and SH01
        # documents; the others finish in seconds.
        run: npm run collect -- --budget=900 $SOURCES
        env:
          SOURCES: ${{ github.event.inputs.sources }}
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
          COMPANIES_HOUSE_API_KEY: ${{ secrets.COMPANIES_HOUSE_API_KEY }}
          COMPANIES_HOUSE_STREAM_KEY: ${{ secrets.COMPANIES_HOUSE_STREAM_KEY }}
      - name: Find company websites
        # After the collectors, so it sees the companies they just fetched.
        # Runs even when a collector failed: it only needs what is stored.
        if: ${{ !cancelled() }}
        run: npm run websites -- --budget=300
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
          BRAVE_SEARCH_API_KEY: ${{ secrets.BRAVE_SEARCH_API_KEY }}
